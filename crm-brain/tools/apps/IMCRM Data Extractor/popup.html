<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 380px;
      padding: 15px;
      font-family: Arial, sans-serif;
    }
    h3 {
      margin: 0 0 15px 0;
      text-align: center;
    }
    button {
      background: #4CAF50;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 14px;
      cursor: pointer;
      border-radius: 5px;
      width: 100%;
      margin-bottom: 10px;
    }
    button:hover {
      background: #45a049;
    }
    button.copy-btn {
      background: #2196F3;
    }
    button.copy-btn:hover {
      background: #1976D2;
    }
    button.save-number-btn {
      background: #00BCD4;
    }
    button.save-number-btn:hover {
      background: #0097A7;
    }
    button.motor-btn {
      background: #FF5722;
    }
    button.motor-btn:hover {
      background: #E64A19;
    }
    button.save-btn {
      background: #FF9800;
    }
    button.save-btn:hover {
      background: #F57C00;
    }
    button.extract-checked-btn {
      background: #9C27B0;
    }
    button.extract-checked-btn:hover {
      background: #7B1FA2;
    }
    .status {
      margin-bottom: 10px;
      font-size: 12px;
      color: #666;
      text-align: center;
    }
    .output-section {
      margin-top: 15px;
    }
    .output-section label {
      font-weight: bold;
      font-size: 12px;
      display: block;
      margin-bottom: 5px;
    }
    #output {
      width: 100%;
      height: 300px;
      font-family: Arial, sans-serif;
      font-size: 13px;
      border: 1px solid #ddd;
      border-radius: 5px;
      padding: 10px;
      resize: vertical;
      overflow-y: auto;
      box-sizing: border-box;
      white-space: pre-wrap;
      background: #f9f9f9;
    }

  </style>
</head>
<body>
  <h3>IMCRM Data Extractor</h3>
  <button id="extractBtn">Extract Health Lead</button>
  <button class="motor-btn" id="motorExtractBtn">Extract Motor Lead</button>
  <button class="save-number-btn" id="saveNumberBtn">Save Number</button>
  <button class="extract-checked-btn" id="extractCheckedBtn">Select Plans (Pages 1-4)</button>
  <div class="status" id="status"></div>
  <div class="output-section" id="outputSection" style="display:none;">
    <label>Extracted Data:</label>
    <div id="output"></div>
    <button class="copy-btn" id="copyBtn">Copy to Clipboard</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
